name: ci

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash   # bash -eo pipefail, so `cmd | tee log` fails when cmd fails

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (reads lean-toolchain)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build lessons, solutions, exercises and the lab
        run: lake build Metal Solutions Exercises Lab.Spec Lab.Proof 2>&1 | tee build.log

      - name: Lessons and solutions contain no sorry
        run: |
          lake build Metal Solutions 2>&1 | tee ms.log
          if grep -q 'declaration uses `sorry`' ms.log; then
            echo "::error::a lesson or solution uses sorry"; exit 1
          fi

      - name: Headline theorems use only the standard axioms (external audit)
        run: |
          lake env lean --run tools/AxCheck.lean Solutions \
            Metal.sum_never_crashes Metal.Trust.sum_correct Metal.buggy_violates_spec \
            Metal.S03.decode_encode Metal.S07Solution.fixed_never_crashes Metal.S08Ex.e8_2 \
            Metal.S06Ex.e6_1 Metal.S06Ex.e6_3 Metal.S06Ex.e6_4

      - name: Lab frozen files are intact
        run: python3 tools/proof_guard.py --frozen-only

      - name: The guard rejects the unfinished lab (sanity check)
        run: |
          if python3 tools/proof_guard.py; then
            echo "::error::guard accepted the sorry stub"; exit 1
          fi

  rocq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check the Rocq files
        run: nix-shell -p rocqPackages.rocq-core rocqPackages.stdlib --run 'make -C rocq'

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RISC-V assembly (clang) and the fuzzing demo (gcc + ASan)
        run: |
          make -C c asm
          make -C c demo
